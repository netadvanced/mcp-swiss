name: Bug Report
description: Report a broken or incorrect tool in mcp-swiss-ng
title: "[Bug] "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please fill in as much detail as possible.

  - type: input
    id: module
    attributes:
      label: Module affected
      description: "Run `npx -y github:netadvanced/mcp-swiss-ng --list-modules` if you are not sure. Use \"core\" for transport/protocol problems."
      placeholder: "e.g. transport"
    validations:
      required: true

  - type: input
    id: tool
    attributes:
      label: Tool affected
      description: The tool name as the MCP client reports it. Leave empty if the problem is not tool-specific.
      placeholder: "e.g. get_water_level"

  - type: textarea
    id: description
    attributes:
      label: Bug description
      description: A clear description of what the bug is.
      placeholder: "e.g. get_water_level for station 2135 returns empty payload even though the Aare is flowing fine."
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: How to trigger the bug. Include the MCP tool call.
      placeholder: |
        1. Configure mcp-swiss-ng in Claude Desktop
        2. Ask: "What is the current water temperature of the Aare in Bern?"
        3. The tool calls get_water_level with station: "2135"
        4. Response: { payload: [] }
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      placeholder: "Should return payload with temperature, height, and flow values."
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior / response received
      description: Paste the raw tool response if available.
      render: json
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: mcp-swiss-ng version
      placeholder: "e.g. 0.9.0 — run: npx -y github:netadvanced/mcp-swiss-ng --version"
    validations:
      required: true

  - type: dropdown
    id: node
    attributes:
      label: Node.js version
      options:
        - "22.x"
        - "24.x"
        - Other
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS
        - Linux
        - Windows
        - Other
    validations:
      required: true

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I have searched existing issues and this is not a duplicate
          required: true
        - label: I can reproduce this consistently
          required: false
