name: Publish to MCP Registry

on:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write  # Required for GitHub OIDC authentication

# Only one registry publish at a time
concurrency:
  group: mcp-registry
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to MCP Registry
    runs-on: ubuntu-latest
    # Registry entries point at the npm package — only when PUBLISH_NPM=true
    if: vars.PUBLISH_NPM == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Wait for npm propagation
        run: sleep 90

      - name: Install mcp-publisher
        env:
          # Checksum comes from registry_1.8.1_checksums.txt on the release.
          # Bump both together when upgrading.
          PUBLISHER_VERSION: v1.8.1
          PUBLISHER_SHA256: a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl -fsSL -o mcp-publisher.tar.gz \
            "https://github.com/modelcontextprotocol/registry/releases/download/${PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          echo "${PUBLISHER_SHA256}  mcp-publisher.tar.gz" | sha256sum -c -
          tar xzf mcp-publisher.tar.gz mcp-publisher
          chmod +x mcp-publisher
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Authenticate with MCP Registry (GitHub OIDC)
        run: mcp-publisher login github-oidc

      - name: Publish server.json to MCP Registry
        run: mcp-publisher publish server.json
