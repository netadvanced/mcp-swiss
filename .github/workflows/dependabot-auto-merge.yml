name: Dependabot Auto-Merge

on:
  pull_request:

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      # @modelcontextprotocol/sdk is the only runtime dependency: it ships in
      # the server, so its bumps are reviewed by hand. Everything else here is
      # a dev dependency or a GitHub Action.
      - name: Decide
        id: gate
        env:
          UPDATE_TYPE: ${{ steps.metadata.outputs.update-type }}
          NAMES: ${{ steps.metadata.outputs.dependency-names }}
        run: |
          eligible=false
          case "$UPDATE_TYPE" in
            version-update:semver-patch|version-update:semver-minor) eligible=true ;;
          esac
          if printf '%s' "$NAMES" | tr ',' '\n' | tr -d ' ' | grep -qx '@modelcontextprotocol/sdk'; then
            eligible=false
          fi
          echo "eligible=$eligible" >> "$GITHUB_OUTPUT"

      - name: Auto-approve
        if: steps.gate.outputs.eligible == 'true'
        run: gh pr review --approve "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Auto-merge
        if: steps.gate.outputs.eligible == 'true'
        run: gh pr merge --auto --merge "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
